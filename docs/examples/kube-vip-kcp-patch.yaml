# Fragment: the fields of a KubeadmControlPlane that run kube-vip on the VIP of a NetBoxNetwork
# with controlPlaneEndpoint. The other fields of the KubeadmControlPlane are left out.
#
# The NetBoxNetwork writes the VIP to Cluster.spec.controlPlaneEndpoint before CAPI renders the
# cloud-init, which carries it as controlPlaneEndpoint (kubeadm.yaml of the first control plane
# machine) and apiServerEndpoint (kubeadm-join-config.yaml of the others). The pre command copies
# it into the kube-vip manifest. Omit the control plane endpoint of the infrastructure cluster
# (for CAPV, VSphereCluster.spec.controlPlaneEndpoint) entirely.
#
# From Kubernetes 1.29 kubeadm init needs the super-admin.conf workaround for kube-vip; the
# CAPV cluster template has the script for it.
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: demo
spec:
  kubeadmConfigSpec:
    files:
    - path: /etc/kubernetes/manifests/kube-vip.yaml
      owner: root:root
      permissions: "0644"
      content: |
        apiVersion: v1
        kind: Pod
        metadata:
          name: kube-vip
          namespace: kube-system
        spec:
          containers:
          - args: [manager]
            env:
            - {name: vip_arp, value: "true"}
            - {name: port, value: "6443"}   # must match controlPlaneEndpoint.port of the NetBoxNetwork
            - {name: vip_cidr, value: "32"}
            - {name: cp_enable, value: "true"}
            - {name: cp_namespace, value: kube-system}
            - {name: vip_leaderelection, value: "true"}
            - {name: address, value: __CONTROL_PLANE_ENDPOINT__}
            image: ghcr.io/kube-vip/kube-vip:v0.6.4
            name: kube-vip
            securityContext:
              capabilities:
                add: [NET_ADMIN, NET_RAW]
            volumeMounts:
            - {mountPath: /etc/kubernetes/admin.conf, name: kubeconfig}
          hostNetwork: true
          volumes:
          - hostPath: {path: /etc/kubernetes/admin.conf}
            name: kubeconfig
    preKubeadmCommands:
    - >-
      f=/run/kubeadm/kubeadm.yaml; [ -f "$f" ] || f=/run/kubeadm/kubeadm-join-config.yaml;
      ep=$(sed -nE 's/^ *(controlPlaneEndpoint|apiServerEndpoint): *"?([^:"]+):[0-9]+"?$/\2/p' "$f" | head -1);
      [ -n "$ep" ] || { echo "no control plane endpoint in $f" >&2; exit 1; };
      sed -i "s/__CONTROL_PLANE_ENDPOINT__/$ep/" /etc/kubernetes/manifests/kube-vip.yaml
