# One /26 per cluster, carved from the parent L2 network 10.10.0.0/22:
#
#   offset   0-1   unused: in the first /26 of the parent they are its network address and gateway (InvalidRange)
#   offset   2-7   demo-cp       control plane machines (6)
#   offset  8-15   demo-ingress  ingress nodes (8)
#   offset 16-53   demo-workers  worker machines (16..-11, the rest)
#   offset 54-61   demo-metallb  MetalLB addresses (-10..-3, 8)
#   offset 62-63   the VIP of controlPlaneEndpoint: the highest free address, 63, or 62 in the
#                  last /26 of the parent, where 63 is its broadcast address; no pool covers it
#
# Apply in the namespace of the Cluster `demo`:
#   kubectl apply -n <namespace> -f network-scheme.yaml
apiVersion: ipam.cluster.x-k8s.io/v1alpha1
kind: NetBoxNetwork
metadata:
  name: demo
spec:
  clusterName: demo
  parentPrefix: 10.10.0.0/22
  gateway: 10.10.0.1
  prefixLength: 26
  # The VIP is written to Cluster.spec.controlPlaneEndpoint while that has no host or no port.
  controlPlaneEndpoint:
    port: 6443
    dnsName: demo-api.example
  # Optional metadata on the NetBox prefix; tags and custom fields must exist in NetBox.
  # tags: [k8s]
  # customFields:
  #   labels: {cluster: demo}
---
apiVersion: ipam.cluster.x-k8s.io/v1alpha1
kind: NetBoxIPPool
metadata:
  name: demo-cp
  labels:
    cluster.x-k8s.io/cluster-name: demo
spec:
  ranges:
  - {networkName: demo, start: 2, end: 7}
---
apiVersion: ipam.cluster.x-k8s.io/v1alpha1
kind: NetBoxIPPool
metadata:
  name: demo-ingress
  labels:
    cluster.x-k8s.io/cluster-name: demo
spec:
  ranges:
  - {networkName: demo, start: 8, end: 15}
---
apiVersion: ipam.cluster.x-k8s.io/v1alpha1
kind: NetBoxIPPool
metadata:
  name: demo-workers
  labels:
    cluster.x-k8s.io/cluster-name: demo
spec:
  ranges:
  - {networkName: demo, start: 16, end: -11}
---
apiVersion: ipam.cluster.x-k8s.io/v1alpha1
kind: NetBoxIPPool
metadata:
  name: demo-metallb
  labels:
    cluster.x-k8s.io/cluster-name: demo
spec:
  ranges:
  - {networkName: demo, start: -10, end: -3}
