# One /26 per cluster, carved from the parent L2 network 10.10.0.0/22. The network lays out its prefix from the
# start, in the order of spec.pools, on free addresses: not the network, broadcast or gateway of 10.10.0.0/22,
# not the VIP, not used in NetBox by anything else.
#
#   cp       control plane machines, 6 addresses
#   ingress  ingress nodes, 8 addresses
#   workers  worker machines, the rest
#   the VIP of controlPlaneEndpoint: the highest free address, reserved before the pools are placed
#   metallb  2 addresses reserved in NetBox under the VIP, for MetalLB; .Index 1 is the higher one
#
# status.layout of the network shows the NetBox ranges each pool got and the addresses of each group;
# each NetBoxIPPool hands out one pool.
# Apply in the namespace of the Cluster `demo`:
#   kubectl apply -n <namespace> -f network-scheme.yaml
apiVersion: ipam.cluster.x-k8s.io/v1alpha1
kind: NetBoxNetwork
metadata:
  name: demo
spec:
  clusterName: demo
  parentPrefix: 10.10.0.0/22
  gateway: 10.10.0.1
  prefixLength: 26
  # The VIP is written to Cluster.spec.controlPlaneEndpoint while that has no host or no port.
  controlPlaneEndpoint:
    port: 6443
    dnsName: "{{ .Cluster }}-controlplane.example.test"
  pools:
  - {name: cp, size: 6}
  - {name: ingress, size: 8}
  - {name: workers, size: rest}
  addresses:
  - {name: metallb, count: 2, dnsName: "{{ .Cluster }}-metallb-{{ .Index }}.example.test"}
  # Optional metadata on the NetBox prefix; tags and custom fields must exist in NetBox.
  # tags: [k8s]
  # customFields:
  #   labels: {cluster: demo}
---
apiVersion: ipam.cluster.x-k8s.io/v1alpha1
kind: NetBoxIPPool
metadata:
  name: demo-cp
  labels:
    cluster.x-k8s.io/cluster-name: demo
spec:
  ranges:
  - {networkName: demo, pool: cp}
---
apiVersion: ipam.cluster.x-k8s.io/v1alpha1
kind: NetBoxIPPool
metadata:
  name: demo-ingress
  labels:
    cluster.x-k8s.io/cluster-name: demo
spec:
  ranges:
  - {networkName: demo, pool: ingress}
---
apiVersion: ipam.cluster.x-k8s.io/v1alpha1
kind: NetBoxIPPool
metadata:
  name: demo-workers
  labels:
    cluster.x-k8s.io/cluster-name: demo
spec:
  ranges:
  - {networkName: demo, pool: workers}
