# clusterctl config of the dev stand, used instead of the user's global one.
# The provider comes from the local repository written by make release; run clusterctl from the repository root.
# NETBOX_URL, NETBOX_TOKEN and NETBOX_OWNER are taken from the environment.
providers:
- name: netbox
  type: IPAMProvider
  url: file://${PWD}/out/repo/ipam-netbox/latest/ipam-components.yaml
CLUSTERCTL_DISABLE_VERSIONCHECK: "true"
