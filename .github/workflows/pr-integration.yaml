name: pr-integration

on:
  pull_request:
  push:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  integration:
    name: integration (NetBox ${{ matrix.netbox }}${{ matrix.mode && ', instance ci' || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        netbox: [v4.6.7-5.0.2, v4.7.2-5.1.1]
        mode: ['']
        include:
        - netbox: v4.6.7-5.0.2
          mode: instance
    env:
      NETBOX_IMAGE: docker.io/netboxcommunity/netbox:${{ matrix.netbox }}
      NETBOX_TEST_MODE: ${{ matrix.mode }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    # Waits for the NetBox healthcheck (up to 5 minutes) and seeds it.
    - name: Start NetBox
      run: make netbox-up
    - name: Integration test
      run: |
        echo "NETBOX_TEST_MODE=${NETBOX_TEST_MODE:-<empty: default mode>}"
        make test-integration
    - name: NetBox logs
      if: failure()
      run: docker compose -f hack/dev/compose.yaml logs --no-color --tail=200
