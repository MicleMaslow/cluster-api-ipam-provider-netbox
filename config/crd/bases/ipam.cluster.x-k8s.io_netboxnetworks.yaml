                format: int32
                maximum: 32
                minimum: 1
                type: integer
                x-kubernetes-validations:
                - message: prefixLength is immutable
                  rule: self == oldSelf
              tags:
                description: tags are slugs of existing NetBox tags set on the prefix.
                  Tags added by others are kept.
