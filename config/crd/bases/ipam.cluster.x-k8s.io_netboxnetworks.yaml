              rule: has(self.prefix) == has(oldSelf.prefix)
            - message: gateway must be inside parentPrefix
              rule: '!isCIDR(self.parentPrefix) || !isIP(self.gateway) || cidr(self.parentPrefix).containsIP(self.gateway)'
            - message: prefix must be inside parentPrefix
              rule: '!has(self.prefix) || !isCIDR(self.parentPrefix) || !isCIDR(self.prefix)
                || cidr(self.parentPrefix).containsCIDR(self.prefix)'
            - message: prefixLength must be longer than the parentPrefix mask
              rule: '!has(self.prefixLength) || !isCIDR(self.parentPrefix) || self.prefixLength
