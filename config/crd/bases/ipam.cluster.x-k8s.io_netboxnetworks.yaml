                - Delete
                type: string
              gateway:
                description: gateway of the parent network.
                maxLength: 39
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: must be an IP address
                  rule: isIP(self)
                - message: only IPv4 is supported
                  rule: '!isIP(self) || ip(self).family() == 4'
                - message: gateway is immutable
                  rule: self == oldSelf
              parentPrefix:
                description: parentPrefix is the L2 network the prefix lives in; addresses
                  get its mask.
                maxLength: 43
                minLength: 1
