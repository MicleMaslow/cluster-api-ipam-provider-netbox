apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: capi-ipam-netbox-system
namePrefix: capi-ipam-netbox-
labels:
- pairs:
    cluster.x-k8s.io/provider: ipam-netbox
resources:
- ../crd
- ../rbac
- ../manager
# make sets the image on a copy with kustomize edit set image controller=$(IMG).
images:
- name: controller
  newName: ghcr.io/miclemaslow/cluster-api-ipam-provider-netbox
  newTag: dev
